[package]
name = "blitzcrank-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Experimental typed tabular Blitzcrank pipeline using standalone Delayed Coding"

[dependencies]
delayed-coding = { git = "https://github.com/embryo-labs/delayed-coding", rev = "847df1439f0345d652515f19b486fd9bcf5264bd" }
delayed-coding-simd = { git = "https://github.com/embryo-labs/delayed-coding", rev = "847df1439f0345d652515f19b486fd9bcf5264bd" }
serde_json = "1.0"

[features]
default = []
# Rust 1.89+; runtime detection, scalar fallback, opt-in bulk profile only.
avx512 = ["delayed-coding-simd/avx512"]

[profile.release]
lto = "thin"
codegen-units = 1

[workspace]
